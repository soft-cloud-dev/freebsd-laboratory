#!/bin/sh

: ${LAB_VM_PACKAGES:="python3"}
: ${LAB_VM_IPYKERNEL_PACKAGE:=""}
: ${LAB_VM_CLOUD_INIT_PACKAGE:=""}
: ${LAB_FAIL_ON_PKG_AUDIT:="YES"}
: ${LAB_PKG_AUDIT_ALLOWED_VULN_IDS:=""}
: ${LAB_BUILD_ID:="unknown"}
: ${LAB_SOURCE_BRANCH:="unknown"}
: ${LAB_SOURCE_REVISION:="unknown"}
: ${LAB_SSHD_POLICY:=""}

export VM_EXTRA_PACKAGES="${VM_EXTRA_PACKAGES:-} ${LAB_VM_PACKAGES}"
export VM_RC_LIST="${VM_RC_LIST:-} sshd nuageinit"

LAB_VM_AUDIT_ENFORCED=true
LAB_VM_AUDIT_ACCEPTED_IDS=""

vm_create_base()
{
    # mk-vmimage.sh is started by make(1), but etcupdate later runs its own
    # source-tree makes.  Do not leak the release target's recursive flags
    # into that independent distribution pass.
    unset MAKEFLAGS
    mkdir -p "${DESTDIR}/usr/local/lib" || return 1
}

vm_refresh_ldconfig()
{
    if [ ! -x "${DESTDIR}/etc/rc.d/ldconfig" ]; then
        echo "Target ldconfig rc.d script is unavailable: ${DESTDIR}/etc/rc.d/ldconfig" >&2
        return 1
    fi

    chroot "${DESTDIR}" /etc/rc.d/ldconfig forcestart || return 1
    if [ ! -s "${DESTDIR}/var/run/ld-elf.so.hints" ]; then
        echo "Target ldconfig did not create /var/run/ld-elf.so.hints" >&2
        return 1
    fi
    if ! chroot "${DESTDIR}" /sbin/ldconfig -r 2>/dev/null | \
        grep -Eq '(^|[[:space:]:])/usr/local/lib([[:space:]:]|$)'; then
        echo "Target linker hints do not include /usr/local/lib" >&2
        return 1
    fi
}

vm_pkg_audit()
{
    AUDIT_OUTPUT=$(mktemp /tmp/freebsd-lab-vm-pkg-audit.XXXXXX) || return 1
    AUDIT_STATUS=0
    if [ -n "${PKG_REPOS_DIR:-}" ]; then
        pkg -r "${DESTDIR}" -R "${PKG_REPOS_DIR}" audit -F >"${AUDIT_OUTPUT}" 2>&1 || \
            AUDIT_STATUS=$?
    else
        pkg -r "${DESTDIR}" audit -F >"${AUDIT_OUTPUT}" 2>&1 || AUDIT_STATUS=$?
    fi
    cat "${AUDIT_OUTPUT}"

    if [ "${AUDIT_STATUS}" -eq 0 ]; then
        rm -f "${AUDIT_OUTPUT}"
        return 0
    fi
    if [ "${LAB_FAIL_ON_PKG_AUDIT}" != "YES" ]; then
        LAB_VM_AUDIT_ENFORCED=false
        echo "WARNING: pkg audit findings were not enforced because LAB_FAIL_ON_PKG_AUDIT=${LAB_FAIL_ON_PKG_AUDIT}" >&2
        rm -f "${AUDIT_OUTPUT}"
        return 0
    fi
    if [ -z "${LAB_PKG_AUDIT_ALLOWED_VULN_IDS}" ]; then
        rm -f "${AUDIT_OUTPUT}"
        return "${AUDIT_STATUS}"
    fi

    PROBLEM_COUNT=$(sed -n 's/^[[:space:]]*\([0-9][0-9]*\) problem(s).*$/\1/p' "${AUDIT_OUTPUT}" | tail -1)
    WWW_COUNT=$(grep -Ec '^[[:space:]]*WWW:[[:space:]]' "${AUDIT_OUTPUT}" || true)
    VUXML_IDS=$(sed -n 's#^[[:space:]]*WWW:[[:space:]]*https://[Vv][Uu][Xx][Mm][Ll]\.[Ff][Rr][Ee][Ee][Bb][Ss][Dd]\.org/freebsd/\([0-9A-Fa-f-][0-9A-Fa-f-]*\)\.html[[:space:]]*$#\1#p' "${AUDIT_OUTPUT}" | sort -u)
    VUXML_COUNT=$(printf '%s\n' "${VUXML_IDS}" | awk 'NF {count++} END {print count+0}')

    if [ -z "${PROBLEM_COUNT}" ] || [ "${WWW_COUNT}" -ne "${PROBLEM_COUNT}" ] || \
        [ "${VUXML_COUNT}" -ne "${PROBLEM_COUNT}" ]; then
        echo "pkg audit output could not be reduced to exact FreeBSD VuXML findings; refusing the exception" >&2
        rm -f "${AUDIT_OUTPUT}"
        return "${AUDIT_STATUS}"
    fi

    for VUXML_ID in ${VUXML_IDS}; do
        case " ${LAB_PKG_AUDIT_ALLOWED_VULN_IDS} " in
            *" ${VUXML_ID} "*) ;;
            *)
                echo "Unapproved pkg audit finding: ${VUXML_ID}" >&2
                rm -f "${AUDIT_OUTPUT}"
                return "${AUDIT_STATUS}"
                ;;
        esac
    done

    LAB_VM_AUDIT_ACCEPTED_IDS=$(printf '%s\n' "${VUXML_IDS}" | tr '\n' ' ' | sed 's/[[:space:]]*$//')
    echo "WARNING: accepting only explicitly allowlisted FreeBSD VuXML findings: ${LAB_VM_AUDIT_ACCEPTED_IDS}" >&2
    rm -f "${AUDIT_OUTPUT}"
    return 0
}

vm_extra_install_base()
{
    vm_refresh_ldconfig || return 1
}

vm_extra_pre_umount()
{
    if [ -z "${LAB_SSHD_POLICY}" ] || [ ! -f "${LAB_SSHD_POLICY}" ]; then
        echo "Laboratory SSH policy is unavailable: ${LAB_SSHD_POLICY}" >&2
        return 1
    fi

    if ! pw -R "${DESTDIR}" usershow freebsd >/dev/null 2>&1; then
        pw -R "${DESTDIR}" useradd freebsd -m -s /bin/sh -w no || return 1
    fi

    LAB_VM_FREEBSD_UID=$(pw -R "${DESTDIR}" usershow freebsd -7 | awk -F: '{print $3}') || return 1
    LAB_VM_FREEBSD_GID=$(pw -R "${DESTDIR}" usershow freebsd -7 | awk -F: '{print $4}') || return 1
    [ -n "${LAB_VM_FREEBSD_UID}" ] && [ -n "${LAB_VM_FREEBSD_GID}" ] || return 1
    chown "${LAB_VM_FREEBSD_UID}:${LAB_VM_FREEBSD_GID}" "${DESTDIR}/home/freebsd" || return 1
    chmod 0755 "${DESTDIR}/home/freebsd" || return 1
    install -d -o "${LAB_VM_FREEBSD_UID}" -g "${LAB_VM_FREEBSD_GID}" -m 0700 \
        "${DESTDIR}/home/freebsd/.ssh" || return 1
    install -o "${LAB_VM_FREEBSD_UID}" -g "${LAB_VM_FREEBSD_GID}" -m 0600 \
        /dev/null "${DESTDIR}/home/freebsd/.ssh/authorized_keys" || return 1

    install -d -m 0755 "${DESTDIR}/etc/ssh/sshd_config.d" || return 1
    install -m 0644 "${LAB_SSHD_POLICY}" \
        "${DESTDIR}/etc/ssh/sshd_config.d/99-freebsd-laboratory.conf" || return 1

    if ! grep -Eq '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config.d/\*\.conf' \
        "${DESTDIR}/etc/ssh/sshd_config"; then
        printf '\nInclude /etc/ssh/sshd_config.d/*.conf\n' >> "${DESTDIR}/etc/ssh/sshd_config"
    fi

    rm -f "${DESTDIR}"/etc/ssh/ssh_host_*_key "${DESTDIR}"/etc/ssh/ssh_host_*_key.pub

    install -d -m 0755 "${DESTDIR}/etc/cloud/cloud.cfg.d" || return 1
    cat > "${DESTDIR}/etc/cloud/cloud.cfg.d/99-freebsd-laboratory.cfg" <<'EOF'
ssh_pwauth: false
disable_root: true
EOF

    vm_refresh_ldconfig || return 1

    LAB_VM_PYTHON_TAG=$(chroot "${DESTDIR}" /usr/local/bin/python3 -c \
        'import sys; print("py{}{}".format(sys.version_info.major, sys.version_info.minor))') || return 1
    if [ -z "${LAB_VM_IPYKERNEL_PACKAGE}" ]; then
        LAB_VM_IPYKERNEL_PACKAGE="${LAB_VM_PYTHON_TAG}-ipykernel"
    fi
    if [ -z "${LAB_VM_CLOUD_INIT_PACKAGE}" ]; then
        LAB_VM_CLOUD_INIT_PACKAGE="${LAB_VM_PYTHON_TAG}-cloud-init"
    fi

    if [ -n "${PKG_REPOS_DIR:-}" ]; then
        INSTALL_AS_USER=yes ${PKG_CMD} \
            -o ABI="${PKG_ABI}" \
            -o METALOG="${DESTDIR}/METALOG.pkg" \
            -o REPOS_DIR="${PKG_REPOS_DIR}" \
            -o PKG_DBDIR="${DESTDIR}/var/db/pkg" \
            -r "${DESTDIR}" \
            install -y -r "${PKG_REPO_NAME}" \
            "${LAB_VM_IPYKERNEL_PACKAGE}" "${LAB_VM_CLOUD_INIT_PACKAGE}" || return 1
    else
        INSTALL_AS_USER=yes ${PKG_CMD} \
            -o ABI="${PKG_ABI}" \
            -o METALOG="${DESTDIR}/METALOG.pkg" \
            -o PKG_DBDIR="${DESTDIR}/var/db/pkg" \
            -r "${DESTDIR}" \
            install -y -r "${PKG_REPO_NAME}" \
            "${LAB_VM_IPYKERNEL_PACKAGE}" "${LAB_VM_CLOUD_INIT_PACKAGE}" || return 1
    fi

    vm_refresh_ldconfig || return 1

    chroot "${DESTDIR}" /usr/local/bin/python3 -c 'import ipykernel' || return 1

    vm_pkg_audit || return 1

    install -d -m 0755 "${DESTDIR}/usr/local/share/freebsd-laboratory" || return 1
    cat > "${DESTDIR}/usr/local/share/freebsd-laboratory/image-manifest.json" <<EOF
{
  "schema": "softcloud.freebsd-golden-image/v1",
  "type": "bhyve-raw",
  "build_id": "${LAB_BUILD_ID}",
  "source_branch": "${LAB_SOURCE_BRANCH}",
  "source_revision": "${LAB_SOURCE_REVISION}",
  "pkg_audit_enforced": ${LAB_VM_AUDIT_ENFORCED},
  "pkg_audit_accepted_vuln_ids": "${LAB_VM_AUDIT_ACCEPTED_IDS}"
}
EOF

    return 0
}
