schema: softcloud.lab/v1
id: freebsd-intro
title: FreeBSD Laboratory

runtime:
  os: freebsd
  release: "14.1"
  architecture: amd64

executor:
  type: jail
  ephemeral: true
  template_snapshot: zroot/jails/templates/freebsd-python@clean
  dataset_parent: zroot/jails/containers
  mount_root: /usr/local/jails/containers
  network: inherit
  alternatives:
    bhyve:
      kernelspec: freebsd-python-bhyve
      manager: vm-bhyve
      ephemeral: true
      template: freebsd-lab
      image: freebsd-python.raw
      network: 172.31.254.0/24
      address_pool: 172.31.254.100-172.31.254.199

notebook: notebooks/Intro.ipynb

checks:
  - id: kernel
    command: sysctl -n kern.ostype
    expect:
      stdout: FreeBSD
  - id: release
    command: freebsd-version

evidence:
  commands: true
  stdout: true
  stderr: true
  environment: true
  hashes: true

stages:
  - observed
  - explained
  - reproduced
  - modified
  - verified
  - recovered
  - designed
