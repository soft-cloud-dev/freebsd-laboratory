schema: softcloud.lab/v1
id: freebsd-intro
title: FreeBSD Laboratory

runtime:
  os: freebsd
  release: "14.1"
  architecture: amd64

executor:
  type: jail
  ephemeral: true
  control:
    mode: unix-socket
    socket: /var/run/freebsd-laboratory/runtime.sock
    privileged_daemon: freebsd-lab-runtime-daemon
  template_snapshot: zroot/jails/templates/freebsd-python@clean
  dataset_parent: zroot/jails/containers
  mount_root: /usr/local/jails/containers
  network:
    mode: vnet
    bridge: labbridge0
    cidr: 172.31.254.0/24
    host_address: 172.31.254.1
    address_pool: 172.31.254.10-172.31.254.199
    uplink: none
    private_members: true
  alternatives:
    bhyve:
      kernelspec: freebsd-python-bhyve
      manager: vm-bhyve
      ephemeral: true
      template: freebsd-lab
      image: freebsd-python.raw
      switch: freebsdlab
      bridge: labbridge0
      network: 172.31.254.0/24
    bhyve-linux:
      kernelspec: linux-python-bhyve
      manager: vm-bhyve
      ephemeral: true
      template: linux-lab
      image: linux-python.raw
      switch: freebsdlab
      bridge: labbridge0
      network: 172.31.254.0/24
      runtime:
        os: linux
        architecture: amd64
      checks:
        - id: kernel
          command: uname -s
          expect:
            stdout: Linux

notebook: notebooks/Intro.ipynb

checks:
  - id: kernel
    command: sysctl -n kern.ostype
    expect:
      stdout: FreeBSD
  - id: release
    command: freebsd-version

evidence:
  commands: true
  stdout: true
  stderr: true
  environment: true
  hashes: true
  signing:
    enabled: false
    algorithm: ed25519
    key_id: software-cloud-lab
    private_key: /usr/local/etc/freebsd-laboratory/evidence-ed25519.pem

stages:
  - observed
  - explained
  - reproduced
  - modified
  - verified
  - recovered
  - designed
