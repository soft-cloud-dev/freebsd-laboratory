schema: softcloud.lab/v1
id: freebsd-intro
title: FreeBSD Laboratory

runtime:
  os: freebsd
  release: "14.1"
  architecture: amd64

executor:
  type: jail
  ephemeral: true
  template_snapshot: zroot/jails/templates/freebsd-python@clean
  dataset_parent: zroot/jails/containers
  mount_root: /usr/local/jails/containers
  network: inherit

notebook: notebooks/Intro.ipynb

checks:
  - id: kernel
    command: sysctl -n kern.ostype
    expect:
      stdout: FreeBSD
  - id: release
    command: freebsd-version

evidence:
  commands: true
  stdout: true
  stderr: true
  environment: true
  hashes: true

stages:
  - observed
  - explained
  - reproduced
  - modified
  - verified
  - recovered
  - designed
