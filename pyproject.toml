[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freebsd-laboratory"
version = "0.1.0"
description = "Governed executable FreeBSD documentation for JupyterLab"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
authors = [
  { name = "Software Cloud" }
]
dependencies = [
  "jupyter-client>=8.6,<9",
  "jupyter-server>=2.15,<3",
  "jupyterlab>=4.3,<5",
  "PyYAML>=6,<7",
  "sentry-sdk>=2,<3",
  "traitlets>=5.14,<6"
]

[project.optional-dependencies]
signing = [
  "cryptography>=45,<47"
]
agent = [
  "llama-cpp-python>=0.3,<1"
]
dev = [
  "cryptography>=45,<47",
  "pytest>=8,<9",
  "ruff>=0.12,<1"
]

[project.scripts]
freebsd-lab-install-kernel = "freebsd_laboratory.install:main"
freebsd-lab-runtime-daemon = "freebsd_laboratory.runtime_entrypoint:main"
freebsd-lab-gc = "freebsd_laboratory.gc:main"
freebsd-lab-verify-evidence = "freebsd_laboratory.verify:main"
freebsd-lab-sentry-diagnose = "freebsd_laboratory.sentry_diagnostics:main"
freebsd-lab-benchmark = "freebsd_laboratory.benchmark:main"
freebsd-lab-agent = "freebsd_laboratory.agent.cli:main"

[project.entry-points."jupyter_client.kernel_provisioners"]
freebsd-jail-provisioner = "freebsd_laboratory.provisioner:FreeBSDJailProvisioner"
freebsd-bhyve-provisioner = "freebsd_laboratory.bhyve:FreeBSDBhyveProvisioner"
linux-bhyve-provisioner = "freebsd_laboratory.bhyve:LinuxBhyveProvisioner"

[tool.setuptools.packages.find]
include = ["freebsd_laboratory*"]

[tool.setuptools.package-data]
freebsd_laboratory = [
  "kernels/freebsd-python/kernel.json",
  "kernels/freebsd-python-bhyve/kernel.json",
  "kernels/linux-python-bhyve/kernel.json",
  "vm-bhyve/freebsd-lab.conf",
  "vm-bhyve/freebsd-lab-memdisk.conf",
  "vm-bhyve/linux-lab.conf",
  "vm-bhyve/linux-lab-memdisk.conf"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
