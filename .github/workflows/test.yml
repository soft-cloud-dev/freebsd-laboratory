name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q freebsd_laboratory tests
      - name: Validate FreeBSD shell assets
        run: |
          test -x deploy/freebsd/validate-pf.sh
          test -x deploy/freebsd/images/build-golden-images.sh
          test -x deploy/freebsd/images/build-jail-template.sh
          test -x deploy/freebsd/images/build-bhyve-image.sh
          sh -n deploy/freebsd/rc.d/freebsd_lab_daemon
          sh -n deploy/freebsd/validate-pf.sh
          sh -n deploy/freebsd/images/build-golden-images.sh
          sh -n deploy/freebsd/images/build-jail-template.sh
          sh -n deploy/freebsd/images/build-bhyve-image.sh
          sh -n deploy/freebsd/images/vmimage.conf
      - run: pytest -q

  labextension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labextension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npm run build
